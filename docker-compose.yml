services:
  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: fsu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/app
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - fsu-network

  # PHP-FPM Application Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fsu-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - ./docker/app/php.ini:/usr/local/etc/php/conf.d/laravel.ini
    environment:
      - APP_NAME=FSU Internal
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=fsu_internal
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - redis
    networks:
      - fsu-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: fsu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: fsu_internal
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - fsu-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "laravel", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache/Queue
  redis:
    image: redis:7-alpine
    container_name: fsu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fsu-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js (Vite Dev Server)
  node:
    image: node:20-alpine
    container_name: fsu-node
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_PORT=5173
    networks:
      - fsu-network
    command: sh -c "npm install && npm run dev"
    depends_on:
      - app

  # PhpMyAdmin (Database UI)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: fsu-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: laravel
      PMA_PASSWORD: secret
      PMA_ROOT_PASSWORD: root_secret
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - fsu-network

volumes:
  mysql_data:
  redis_data:

networks:
  fsu-network:
    driver: bridge
